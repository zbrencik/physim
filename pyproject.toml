[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "physim"
version = "1.0.0"
description = "Numerical ODE solvers and physical-layer models, scored against closed-form references"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["numerical-analysis", "ode", "stiff", "dsp", "communications", "ber"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "httpx>=0.26", "ruff>=0.4"]
plots = ["matplotlib>=3.7"]

[project.scripts]
physim = "physim.cli:main"

[project.urls]
Repository = "https://github.com/yourname/physim"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741"]
